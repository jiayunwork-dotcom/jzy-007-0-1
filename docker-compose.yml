services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bs
      POSTGRES_PASSWORD: bs
      POSTGRES_DB: bs_pricing
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bs -d bs_pricing"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://bs:bs@db:5432/bs_pricing
      BS_PARITY_REL_TOL: "1e-9"
      BS_IV_ROUNDTRIP_REL_TOL: "1e-8"
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  pgdata:
